}
function restoreSheet(){
  openSheet("Sicherung einfügen",
    '<div class="group"><div class="field"><label for="r-text">Sicherung (Text)</label><textarea id="r-text" placeholder="{&quot;bills&quot;:[…]}" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div></div>'+
    '<div class="err" id="r-err"></div>'+
    '<button class="primary" id="r-go">Daten übernehmen</button>'+
    '<p class="hint">Die aktuellen Daten auf diesem Gerät werden ersetzt. Ist Cloud-Sync aktiv, wird die Sicherung auch hochgeladen.</p>', null);
  $("r-go").onclick = ()=>{
    try{
      const o = JSON.parse($("r-text").value);
      if(!o || !Array.isArray(o.bills)) throw 0;
      const before = JSON.parse(JSON.stringify(S));
      adoptState(o); save(); closeSheet();
      showToast(S.bills.length+" Rechnungen übernommen", ()=>{ adoptState(before); save(); });
    }catch(e){ $("r-err").textContent = "Das ist keine gültige Sicherung. Kopiere den ganzen Text aus „Sicherung kopieren“."; }
  };
}

/* ---------- Cloud-Sync einrichten ---------- */
let SC = null;
function syncSheet(){
  const on = syncOn();
  const head = '<div class="syncinfo '+syncState+'"><span class="dot"></span><div><b>'+(on?(syncState==="ok"?"Verbunden und synchronisiert":syncState==="error"?"Verbunden, aber Fehler":"Verbunden"):"Nicht verbunden")+'</b>'+
    '<small>'+(on ? esc(SY.owner)+'/'+esc(SY.repo)+(syncAt?'<br>Zuletzt synchronisiert um '+new Date(syncAt).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+' Uhr ('+agoTxt(syncAt)+')':'')+(!navigator.onLine?'<br>Gerade offline, Änderungen werden später hochgeladen.':'') : 'Daten liegen nur auf diesem Gerät.')+'</small>'+
    (on?'<small>'+(SY.key?'Verschlüsselt mit deinem Passwort':'Nicht verschlüsselt')+'</small>':'')+
    (syncState==="error"&&syncErr?'<small class="neg">'+esc(syncErr)+'</small>':'')+'</div></div>';
  if(on){
    openSheet("Cloud-Sync", head+
      '<button class="primary" id="sy-now">Jetzt synchronisieren</button>'+
      '<button class="secondary" id="sy-token">Token ändern</button>'+
      '<button class="danger" id="sy-off">Verbindung trennen</button>'+
      '<p class="hint">Änderungen werden nach etwa einer Sekunde hochgeladen, andere Geräte holen sie alle drei Sekunden ab.</p>', null);
    $("sy-now").onclick = ()=>{ pullNow(true).then(()=>{ if(!dirty) pushNow(); }); showToast("Synchronisiere …", null); };
    $("sy-token").onclick = ()=>{ SY.token=""; saveSY(); syncSheet(); };
    $("sy-off").onclick = ()=>{ SY=null; saveSY(); setSync("local"); closeSheet(); render(); showToast("Cloud-Sync getrennt", null); };
    return;
  }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone;
  openSheet("Cloud-Sync", head+
    (inPreview?'<div class="warnbox">Du siehst gerade die Vorschau in Claude. Der GitHub-Sync funktioniert erst in der Version, die auf GitHub Pages läuft.</div>':'')+
    '<div class="flabel">GitHub-Benutzername</div><input class="inp" id="syO" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(SY&&SY.owner||"")+'" placeholder="z. B. alexander-mustermann">'+
    '<div class="flabel">Name des privaten Daten-Repositorys</div><input class="inp" id="syR" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(SY&&SY.repo||"erstattungen-data")+'">'+
    '<div class="flabel">Token (beginnt mit github_pat_)</div><input class="inp" id="syT" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…">'+
    '<div class="flabel">Verschlüsselungs-Passwort (mind. 10 Zeichen)</div><input class="inp" id="syP" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Auf allen Geräten gleich">'+
    '<button class="primary" id="sy-go">Verbinden</button>'+
    (ios?'<div class="warnbox">Du bist gerade in Safari. Öffne die App über das Icon auf dem Home-Bildschirm und verbinde dort, sonst wirst du dort erneut gefragt.</div>':'')+
    '<p class="hint">Token und Passwort bleiben nur auf diesem Gerät. In GitHub liegt nur verschlüsselter Text. Das Passwort gut merken: Ohne es lassen sich die Cloud-Daten nicht mehr öffnen.</p>', null);
  $("sy-go").onclick = syncConnect;
}
async function syncConnect(){
  const o=$("syO").value.trim(), r=$("syR").value.trim(), t=$("syT").value.trim(), pw=$("syP").value;
  if(!o||!r||!t){ showToast("Bitte Benutzername, Repository und Token ausfüllen", null); return; }
  if(pw && pw.length<10){ showToast("Das Passwort sollte mindestens 10 Zeichen haben", null); return; }
  const prev = SY; let validated = false;
  SY = {owner:o, repo:r, token:t, path:"erstattungen.json"};
  showToast("Prüfe Verbindung …", null);
  try{
    const rr = await fetch("https://api.github.com/repos/"+encodeURIComponent(o)+"/"+encodeURIComponent(r),{headers:ghH(),cache:"no-store"});
    if(rr.status===401) throw "Der Token ist ungültig oder abgelaufen.";
    if(rr.status===404) throw "Repository nicht gefunden. Prüfe Benutzername, Repository-Name und ob der Token Zugriff auf dieses Repository hat.";
    if(!rr.ok) throw "GitHub antwortet mit Fehler "+rr.status+".";
    validated = true; saveSY();
    const g = await fetch(ghUrl(),{headers:ghH(),cache:"no-store"});
    if(g.status===404){
      if(pw){ SY.salt=b64s(crypto.getRandomValues(new Uint8Array(16))); SY.key=await deriveKey(pw,SY.salt); }
      SY.sha=null; saveSY(); await pushNow();
      if(syncState==="ok"){ closeSheet(); render(); showToast("Verbunden. Deine Daten liegen jetzt in der Cloud", null); } else syncSheet();
      return;
    }
    if(!g.ok) throw "Fehler "+g.status+" beim Lesen der Daten.";
    const j = await g.json(); const txt = dec(j.content); const raw = JSON.parse(txt); let remote;
    if(raw && raw.enc){
      if(!pw) throw "Die Cloud-Daten sind verschlüsselt. Bitte dein Passwort eingeben.";
      showToast("Entschlüssele …", null);
      SY.salt = raw.salt; SY.key = await deriveKey(pw, raw.salt);
      try{ remote = await unpackData(txt, SY.key); }catch(e){ throw "Das Passwort ist falsch."; }
    } else {
      remote = raw;
      if(pw){ SY.salt=b64s(crypto.getRandomValues(new Uint8Array(16))); SY.key=await deriveKey(pw,SY.salt); }
    }
    SC = {sha:j.sha, remote}; saveSY();
    const when = remote._ts ? new Date(remote._ts).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "unbekannt";
    openSheet("Daten in der Cloud gefunden",
      '<p class="hint">In deinem Repository liegen schon Daten (Stand '+when+', '+((remote.bills||[]).length)+' Rechnungen). Was soll passieren?</p>'+
      '<button class="primary" id="sc-take">Cloud-Daten übernehmen</button><p class="hint">Empfohlen auf dem zweiten Gerät, z. B. dem iPad.</p>'+
      '<button class="secondary" id="sc-up">Dieses Gerät hochladen</button><p class="hint">Überschreibt die Daten in der Cloud mit denen von diesem Gerät.</p>', null);
    $("sc-take").onclick = ()=>{ SY.sha=SC.sha; saveSY(); adoptRemote(SC.remote); closeSheet(); setSync("ok"); processPQ(); showToast("Cloud-Daten übernommen", null); };
    $("sc-up").onclick = ()=>{ SY.sha=SC.sha; saveSY(); S._ts=Date.now(); persist(); pushNow().then(()=>{ closeSheet(); render(); showToast("Dieses Gerät hochgeladen", null); }); };
  }catch(e){
    const pwErr = typeof e==="string" && /Passwort/.test(e);
    if(!validated || pwErr){ SY=prev; saveSY(); } else saveSY();
    showToast(typeof e==="string" ? e : (inPreview ? "In der Claude-Vorschau ist GitHub nicht erreichbar" : "Keine Verbindung zu GitHub möglich"), null);
  }
}

$("btnSettings").addEventListener("click", openSettings);
$("syncbar").addEventListener("click", syncSheet);
$("btnAdd").addEventListener("click", ()=>openForm(null));

/* ---------- Belege: Fotos verkleinern, lokal speichern, über GitHub synchronisieren ---------- */
const PQ_KEY = "erst_photoq";
let PQ = (()=>{ try{ return JSON.parse(localStorage.getItem(PQ_KEY)||"[]"); }catch(e){ return []; } })();
const savePQ = ()=>{ try{ localStorage.setItem(PQ_KEY, JSON.stringify(PQ)); }catch(e){} };
const photoUrl = id=>"https://api.github.com/repos/"+encodeURIComponent(SY.owner)+"/"+encodeURIComponent(SY.repo)+"/contents/belege/"+encodeURIComponent(id)+".bin";
function queuePhoto(op, id){ PQ = PQ.filter(x=>x.id!==id); PQ.push({op, id}); savePQ(); processPQ(); }
let pqBusy = false;
async function processPQ(){
  if(pqBusy || !syncOn() || !navigator.onLine || !PQ.length) return;
  pqBusy = true;
  try{
    while(PQ.length){
      const it = PQ[0];
      if(it.op==="up"){
        const blob = await photoGetLocal(it.id);
        if(blob){
          const r = await fetch(photoUrl(it.id),{method:"PUT",headers:ghH({"Content-Type":"application/json"}),body:JSON.stringify({message:"Beleg "+it.id, content:await packPhoto(blob)}),cache:"no-store"});
          if(!r.ok && r.status!==422) throw r.status;
        }
      } else {
        const g = await fetch(photoUrl(it.id),{headers:ghH(),cache:"no-store"});
        if(g.ok){
          const j = await g.json();
          const r = await fetch(photoUrl(it.id),{method:"DELETE",headers:ghH({"Content-Type":"application/json"}),body:JSON.stringify({message:"Beleg entfernt", sha:j.sha}),cache:"no-store"});
          if(!r.ok && r.status!==404) throw r.status;
        } else if(g.status!==404) throw g.status;
      }
      PQ.shift(); savePQ();
    }
  }catch(e){} finally{ pqBusy = false; }
}
setInterval(()=>{ if(!document.hidden) processPQ(); }, 15000);
async function packPhoto(blob){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const k = await cryptoKey();
  if(!k) return b64s(bytes);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, bytes);
  return enc(JSON.stringify({enc:"aes-256-gcm", iv:b64s(iv), data:b64s(ct)}));
}
async function fetchPhoto(id){
  if(!syncOn()) return null;
  const r = await fetch(photoUrl(id),{headers:ghH({"Accept":"application/vnd.github.raw"}),cache:"no-store"});
  if(!r.ok) return null;
  const buf = new Uint8Array(await r.arrayBuffer());
  if(buf[0]===123){
    const o = JSON.parse(new TextDecoder().decode(buf)); const k = await cryptoKey(); if(!k) return null;
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64s(o.iv)}, k, unb64s(o.data));
    return new Blob([pt], {type:"image/jpeg"});
  }
  return new Blob([buf], {type:"image/jpeg"});
}
async function getPhoto(id){
  let b = await photoGetLocal(id); if(b) return b;
  try{ b = await fetchPhoto(id); if(b){ await photoPut(id, b); return b; } }catch(e){}
  return null;
}
function dropPhotoIfUnused(id){
  if(S.bills.some(b=>b.photo && b.photo.id===id)) return;
  photoDelLocal(id);
  if(syncOn()) queuePhoto("del", id); else { PQ = PQ.filter(x=>x.id!==id); savePQ(); }
}
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1800/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    const out = await new Promise(res=>c.toBlob(res, "image/jpeg", 0.78));
    if(!out) throw 0;
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Vollbild-Ansicht für Belege ---------- */
let viewerUrl = null;
function openViewer(blob){
  if(viewerUrl) URL.revokeObjectURL(viewerUrl);
  viewerUrl = URL.createObjectURL(blob);
  $("viewerImg").src = viewerUrl; $("viewer").hidden = false;
}
function closeViewer(){ $("viewer").hidden = true; }
$("viewerClose").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", e=>{ if(e.target.id==="viewer") closeViewer(); });
(function(){ let y0 = null; const v = $("viewer");
  v.addEventListener("touchstart", e=>{ y0 = e.touches.length===1 ? e.touches[0].clientY : null; }, {passive:true});
  v.addEventListener("touchend", e=>{ if(y0==null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if(dy > 110) closeViewer(); });
})();

/* ---------- Seiten: Startseite und Rechnungen ---------- */
function goPage(pg, noScroll){
  ui.page = pg;
  $("pageHome").hidden = pg!=="home"; $("pageBills").hidden = pg!=="bills";
  document.querySelectorAll(".tabbar [data-tab]").forEach(b=>{ if(b.dataset.tab===pg) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("topbar").querySelector(".mini").textContent = pg==="bills" ? "Rechnungen" : "Erstattungen";
  closeOpenRow();
  try{ if(pg==="bills"){ if(location.hash!=="#rechnungen") location.hash = "rechnungen"; } else if(location.hash) location.hash = "start"; }catch(e){}
  if(!noScroll) window.scrollTo(0,0);
  $("topbar").classList.toggle("scrolled", window.scrollY > 40);
}
document.querySelectorAll(".tabbar [data-tab]").forEach(b=>b.addEventListener("click", ()=>{
  if(ui.page===b.dataset.tab) window.scrollTo({top:0, behavior:"smooth"}); else goPage(b.dataset.tab);
}));
window.addEventListener("hashchange", ()=>{ const want = location.hash==="#rechnungen" ? "bills" : "home"; if(want!==ui.page) goPage(want); });

/* ---------- Start ---------- */
(async function start(){
  const had = load();
  if(!had){
    const fromIdb = await idbGet(LS_KEY);
    if(fromIdb){ try{ adoptState(JSON.parse(fromIdb)); persist(); }catch(e){} }
    if(!SY){ const s = await idbGet(SYNC_KEY); if(s){ try{ SY = JSON.parse(s); saveSY(); }catch(e){} } }
  }
  ui.page = "home";
  render();
  if(location.hash==="#rechnungen") goPage("bills", true);
  if(syncOn()){ initialPulled=false; bootTs=S._ts||0; setSync("saving"); setTimeout(finishBoot,4000); pullNow("boot"); }
  else setSync("local");
})();
})();
