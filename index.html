<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Erstattungen">
<meta name="theme-color" content="#EDF0F3">
<meta name="format-detection" content="telephone=no">
<title>Erstattungen Beihilfe &amp; KV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  /* Layout: iOS-artige Einspalter-App – Statusleiste mit Sync oben, große Überschrift, Übersicht, Jahresgrenzen, Rechnungskarten, Statistik; Plus-Knopf unten */
  --bg:#EDF0F3; --card:#FFFFFF; --ink:#121920; --muted:#66717D; --line:#DCE1E7; --soft:#F4F6F8;
  --accent:#0B6E77; --hero:#0C3B41; --hero-ink:#F2FAFA;
  --todo:#D0433A; --wait:#C98200; --done:#1D9455; --own:#7457E8; --hold:#2B74E0; --prev:#0E8A7E;
  --todo-bg:#FCEBE9; --wait-bg:#FDF3DF; --done-bg:#E4F5EC; --own-bg:#EFEBFE; --hold-bg:#E5EFFD; --prev-bg:#E2F4F1;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --r:18px; --bar:rgba(237,240,243,.82);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1013; --card:#161C21; --ink:#EDF1F4; --muted:#8D98A3; --line:#25303A; --soft:#1C242A;
    --accent:#44B8C2; --hero:#0F2E33; --hero-ink:#EAF7F8;
    --todo:#FF6D61; --wait:#F2B134; --done:#3DCB80; --own:#A792FF; --hold:#6AA8FF; --prev:#43C9B6;
    --todo-bg:#3A1C1A; --wait-bg:#372A10; --done-bg:#12301F; --own-bg:#261F45; --hold-bg:#142847; --prev-bg:#0F2F2B;
    --bar:rgba(12,16,19,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1013; --card:#161C21; --ink:#EDF1F4; --muted:#8D98A3; --line:#25303A; --soft:#1C242A;
  --accent:#44B8C2; --hero:#0F2E33; --hero-ink:#EAF7F8;
  --todo:#FF6D61; --wait:#F2B134; --done:#3DCB80; --own:#A792FF; --hold:#6AA8FF; --prev:#43C9B6;
  --todo-bg:#3A1C1A; --wait-bg:#372A10; --done-bg:#12301F; --own-bg:#261F45; --hold-bg:#142847; --prev-bg:#0F2F2B;
  --bar:rgba(12,16,19,.82);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Statusleiste (iOS-Navigationsleiste) */
.topbar{position:sticky;top:0;z-index:25;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.topbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--line)}
.topbar .mini{position:absolute;left:50%;bottom:14px;pointer-events:none;font-weight:700;font-size:17px;opacity:0;transform:translate(-50%,4px);transition:all .2s;white-space:nowrap}
.topbar.scrolled .mini{opacity:1;transform:translate(-50%,0)}
.topbar.scrolled .sync span:last-child{max-width:96px}
.topbar .right{flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);max-width:100%;justify-self:start;min-width:0}
.sync .sd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync b{color:var(--ink)}
.sync.ok .sd{background:var(--done);animation:livePulse 2.4s infinite}
.sync.busy .sd{background:var(--wait);animation:blink 1s infinite}
.sync.warn .sd{background:var(--wait)}
.sync.err{color:var(--todo)} .sync.err .sd{background:var(--todo)}
@keyframes livePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes blink{50%{opacity:.3}}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.icon-btn svg{width:19px;height:19px}

header{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.appicon{width:46px;height:46px;border-radius:11px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden}
.appicon svg{width:100%;height:100%;display:block}
header h1{font-family:var(--display);font-size:32px;line-height:1.05;letter-spacing:-.02em;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}

.years{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Übersicht */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:18px 18px 16px;display:grid;gap:12px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hero .lbl{font-size:13px;font-weight:600;opacity:.75;letter-spacing:.02em}
.hero .big{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin-top:2px}
.hero .paid{text-align:right;font-size:13px;opacity:.8}
.hero .paid b{display:block;font-size:17px;opacity:1}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.12);gap:2px}
.bar i{display:block;height:100%;min-width:3px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:7px;opacity:.92;min-width:0}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.legend b{margin-left:auto;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line);display:grid;gap:2px;align-content:start}
.tile .t{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
.tile .s{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.s.c-todo{color:var(--todo)} .s.c-wait{color:var(--wait)} .s.c-done{color:var(--done)} .s.c-own{color:var(--own)} .s.c-hold{color:var(--hold)}

/* Jahr im Blick */
.yc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;overflow:hidden}
.yc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 4px}
.yc-head h2{margin:0;font-size:17px;font-weight:700}
.yc-head span{font-size:12.5px;color:var(--muted);text-align:right}
.lim{padding:12px 16px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-top:1px solid var(--line)}
.yc-head + .lim,.yc-head.meta + .lim{border-top:0}
.yc-head.meta{display:block;padding-top:0;font-size:12.5px;color:var(--muted)}
.lim-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.lim-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--lbg);color:var(--lc)}
.lim-ic svg{width:19px;height:19px}
.lim-tt{flex:1;min-width:0}
.lim-tt b{display:block;font-size:14.5px}
.lim-tt small{font-size:12.5px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--lbg);color:var(--lc);white-space:nowrap}
.meter{position:relative;height:12px;border-radius:6px;background:var(--lbg);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--lc)}
.meter-lbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.lim p{margin:0;font-size:13.5px;line-height:1.4}
.lim p strong{color:var(--lc)}
.lim .extra{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.lim .extra b{color:var(--prev)}
.t-own{--lc:var(--own);--lbg:var(--own-bg)} .t-hold{--lc:var(--hold);--lbg:var(--hold-bg)}
.t-done{--lc:var(--done);--lbg:var(--done-bg)} .t-todo{--lc:var(--todo);--lbg:var(--todo-bg)}

/* Hinweise: Einreichen lohnt sich / Jahresabschluss */
.alerts{display:grid;gap:10px;margin-bottom:12px}
.alerts:empty{display:none}
.alert{border-radius:22px;padding:18px;color:#fff;display:grid;gap:10px;position:relative;overflow:hidden}
.alert::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.alert.a-go{background:linear-gradient(135deg,#1FA463,#0D6E4C);box-shadow:0 10px 30px rgba(29,148,85,.35);animation:goPulse 2.6s ease-in-out infinite}
.alert.a-keep{background:linear-gradient(135deg,#3A86F0,#1E4FA8)}
.alert.a-lost{background:linear-gradient(135deg,#E0534A,#A82E28)}
.alert.a-soon{background:linear-gradient(135deg,#7B61F0,#4B35B8)}
@keyframes goPulse{50%{box-shadow:0 10px 40px rgba(29,148,85,.6)}}
.alert .a-top{display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.alert .a-ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.alert .a-ic svg{width:26px;height:26px}
.alert h3{margin:0;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.alert .a-k{font-size:12.5px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.alert p{margin:0;font-size:14.5px;line-height:1.45;position:relative;z-index:1}
.alert p b{font-weight:800}
.alert .a-btns{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.alert .a-btns button{height:40px;padding:0 16px;border-radius:12px;background:#fff;color:#0D3B2C;font-weight:700;font-size:14.5px}
.alert .a-btns button.ghost{background:rgba(255,255,255,.2);color:#fff}
.alert .a-dl{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:rgba(0,0,0,.18);border-radius:999px;padding:4px 10px;justify-self:start;position:relative;z-index:1}
.yc-head .rep{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:5px;flex:none}
.yc-head .rep svg{width:15px;height:15px}
.yc-head .meta{font-size:12.5px;color:var(--muted);padding:0 16px;margin-top:-2px}
.rep-prev{display:grid;gap:10px}
.rep-prev img{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
.rep-chips{display:flex;gap:8px;overflow-x:auto}
.big-ic{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#1FA463,#0D6E4C);color:#fff;display:grid;place-items:center;margin:4px auto 0}
.big-ic svg{width:40px;height:40px}
.celebrate h3{text-align:center;font-size:22px;margin:4px 0 0}
.celebrate p{text-align:center;margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.celebrate p b{color:var(--ink)}
.blist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.blist div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.blist div:last-child{border-bottom:0}
.blist small{color:var(--muted)}

/* Filter & Suche */
.tools{display:grid;gap:8px;margin:20px 0 6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .cnt{font-size:11px;min-width:17px;height:17px;border-radius:9px;background:var(--line);display:inline-grid;place-items:center;padding:0 4px;color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;color:var(--muted)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);min-width:0;height:100%;-webkit-appearance:none;appearance:none}
.search input:focus{outline:none}

.month{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.list{display:grid;gap:10px}
.hint-swipe{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}

/* Rechnungskarte mit Wischen zum Löschen */
.row{position:relative;border-radius:var(--r);overflow:hidden;background:var(--todo)}
.row-act{position:absolute;right:0;top:0;bottom:0;width:92px;display:flex}
.row-act button{flex:1;color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;gap:4px;align-content:center}
.row-act svg{width:22px;height:22px}
.bill{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.bill.dragging{transition:none}
.bill::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
.bill.s-todo{--st:var(--todo)} .bill.s-wait{--st:var(--wait)} .bill.s-done{--st:var(--done)} .bill.s-hold{--st:var(--hold)}
.bill-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px 10px 16px}
.cat{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.cat svg{width:23px;height:23px}
.bh-main{flex:1;min-width:0;display:grid;gap:3px}
.bh-main .t{font-weight:650;font-size:16.5px;overflow-wrap:anywhere}
.bh-main .sub{font-size:13px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.amt{font-weight:700;font-size:17px;white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px}
.p-todo{background:var(--todo-bg);color:var(--todo)} .p-wait{background:var(--wait-bg);color:var(--wait)} .p-done{background:var(--done-bg);color:var(--done)} .p-hold{background:var(--hold-bg);color:var(--hold)} .p-prev{background:var(--prev-bg);color:var(--prev)}
.sides{display:grid;gap:6px;padding:0 12px 12px 16px}
.side{display:grid;grid-template-columns:88px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:stretch}
.side-lbl{display:grid;align-content:center;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.2}
.side-lbl b{font-size:15px;color:var(--sc);font-weight:700}
.side-lbl small{font-size:11px;font-weight:600;color:var(--sc);line-height:1.2;margin-top:1px;opacity:.85}
.side-lbl small.neg{color:var(--todo)}
.side.st-todo{--sc:var(--todo)} .side.st-wait{--sc:var(--wait)} .side.st-done{--sc:var(--done)} .side.st-own{--sc:var(--own)} .side.st-hold{--sc:var(--hold)}
.tick{height:56px;border-radius:12px;border:1.5px solid var(--line);display:flex;align-items:center;gap:7px;padding:4px 9px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;transition:transform .12s ease,background .15s ease}
.tick:active{transform:scale(.96)}
.tick .box{width:20px;height:20px;border-radius:6px;border:1.5px solid currentColor;flex:none;display:grid;place-items:center;opacity:.7}
.tick .box svg{width:14px;height:14px;opacity:0}
.tick small{display:block;font-size:11px;font-weight:500;opacity:.85}
.tick .tx{min-width:0;line-height:1.15}
.tick.on{border-color:transparent}
.tick.on .box{background:currentColor;opacity:1}
.tick.on .box svg{opacity:1;color:var(--card)}
.tick.sub.on{background:var(--wait-bg);color:var(--wait)}
.tick.paid.on{background:var(--done-bg);color:var(--done)}
.side.st-own .tick.sub.on{background:var(--own-bg);color:var(--own)}
.side.st-hold .tick{border-style:dashed}

.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--card);border-radius:var(--r);border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* Statistik */
.stats{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:24px;display:grid;gap:12px}
.stats h2{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.stats h2 span{font-size:12.5px;color:var(--muted);font-weight:500}
.srow{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center}
.srow .cat{width:32px;height:32px;border-radius:9px}
.srow .cat svg{width:18px;height:18px}
.srow .nm{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.srow .nm small{color:var(--muted);font-weight:500}
.srow .tr{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.srow .tr i{display:block;height:100%;border-radius:3px;background:var(--c)}
.srow .am{font-size:14px;font-weight:700}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));height:56px;padding:0 24px 0 18px;border-radius:28px;background:var(--accent);color:#fff;font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(11,110,119,.35),0 2px 6px rgba(0,0,0,.15);z-index:20}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab svg{width:22px;height:22px}

/* Tab-Leiste (iOS) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:22;display:grid;grid-template-columns:1fr 1fr;padding:6px 24px calc(4px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tabbar button{display:grid;justify-items:center;gap:2px;padding:4px 0 2px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
.tabbar svg{width:27px;height:27px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] svg{fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.tab-badge{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--todo);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.page[hidden],.tab-badge[hidden]{display:none}
header.ph{padding-top:6px}
header.ph h1{font-size:34px}
/* Beleg */
.clip{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--muted)}
.clip svg{width:16px;height:16px}
.photo-box{display:grid;gap:10px;padding:12px 14px}
.photo-thumb{position:relative;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line);min-height:120px;display:grid;place-items:center;color:var(--muted);font-size:13.5px}
.photo-thumb img{display:block;width:100%;max-height:300px;object-fit:cover}
.photo-thumb .zoom{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.photo-btn{height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:14.5px;color:var(--accent);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.photo-btn svg{width:18px;height:18px}
.photo-btn.del{color:var(--todo)}
.photo-btn input{display:none}
.viewer{position:fixed;inset:0;z-index:80;background:#000;display:grid;place-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.viewer-x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;z-index:1}
.viewer-x svg{width:20px;height:20px}

/* Bottom Sheet, nach unten wegwischbar */
.scrim{position:fixed;inset:0;background:rgba(5,10,14,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100% - env(safe-area-inset-top) - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto;visibility:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.open{transform:none;visibility:visible}
.sheet.dragging{transition:none}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 8px;position:relative;gap:8px;touch-action:none}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.sheet-head h2{font-size:17px;margin:6px 0 0;font-weight:700;text-align:center}
.sheet-head button{font-size:16px;color:var(--accent);font-weight:600;margin-top:6px;min-height:36px}
.sheet-head button:first-child{justify-self:start}
.sheet-head button:last-child{justify-self:end}
.sheet-body{overflow-y:auto;padding:6px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-body>*{flex:none}
.group{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.field{display:grid;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label,.glabel{font-size:12.5px;color:var(--muted);font-weight:600}
.field small{font-size:12px;color:var(--muted)}
.glabel{margin:0 4px -6px;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.field input,.field textarea{border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:2px 0;width:100%;min-height:30px}
.field textarea{font-size:13px;min-height:120px;font-family:ui-monospace,Menlo,monospace}
.field input:focus,.field textarea:focus{outline:none}
.money{display:flex;align-items:center;gap:6px}
.money input{font-size:26px;font-weight:700}
.money span{font-size:22px;font-weight:700;color:var(--muted)}
.split{font-size:13px;color:var(--muted);line-height:1.4}
.cgroup{padding:10px 12px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 10px 10px}
.cats button{display:grid;justify-items:center;align-content:start;gap:5px;padding:8px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted);border:1.5px solid transparent;text-align:center;line-height:1.15;hyphens:auto}
.cats button .cat{width:40px;height:40px}
.cats button[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 8%,transparent)}
.st-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:0}
.st-row .nm{font-weight:600;min-width:0}
.st-row .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.st-row input[type=date]{font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:5px 8px;margin-top:6px;max-width:170px}
.st-row.link{cursor:pointer}
.st-row.link .chev{color:var(--muted);font-size:20px}
.paidbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.eur{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px;font-weight:600}
.eur input{width:84px;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:var(--ink);text-align:right}
.eur input:focus{outline:none}
.mini-btn{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--todo)}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+span{background:var(--done)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.primary:disabled,.secondary:disabled{opacity:.45}
.primary{height:52px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;width:100%}
.secondary{height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;width:100%}
.danger{height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--todo);font-weight:600;width:100%}
.danger.confirm{background:var(--todo);color:#fff;border-color:var(--todo)}
.err{color:var(--todo);font-size:13.5px;font-weight:600;margin:-4px 4px 0}
.err:empty{display:none}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:11px;background:var(--soft);border:1px solid var(--line);font-size:21px;font-weight:600}
.stepper b{min-width:58px;text-align:center;font-size:18px}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14.5px;line-height:1.45}
.info b{color:var(--hold)}
.syncinfo{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.syncinfo .dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.syncinfo.ok .dot{background:var(--done)} .syncinfo.error .dot{background:var(--todo)} .syncinfo.saving .dot{background:var(--wait)}
.syncinfo b{display:block}
.syncinfo small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.syncinfo small.neg{color:var(--todo)}
.hint{font-size:12.5px;color:var(--muted);margin:0 4px;line-height:1.45}
.warnbox{background:var(--wait-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.inp{border:1px solid var(--line);background:var(--card);border-radius:12px;height:46px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);width:100%}
.flabel{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 4px -8px}
:root[data-theme="dark"] .fab,:root[data-theme="dark"] .primary{color:#06272A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab,:root:not([data-theme="light"]) .primary{color:#06272A}}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;font-size:14px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:all .22s;z-index:60;width:max-content;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--bg);font-weight:700;padding:6px 10px;border-radius:9px;background:rgba(127,127,127,.25);font-size:13.5px}
.toast button:empty{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:380px){.tick{font-size:13.5px;padding:4px 10px}}
@media (max-width:350px){.side{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.side-lbl{grid-column:1/-1;display:flex;gap:6px;align-items:baseline}.legend{grid-template-columns:1fr}}
</style>
</head>
<body>

  </button></div>
</div>

<main class="wrap page" id="pageHome" aria-label="Startseite">

  {g:"Ärzte", id:"chirurg",label:"Chirurgie",          c:"#5D7489", svg:I('<path d="M4.9 12.9l8-8a3 3 0 0 1 4.2 0l2 2a3 3 0 0 1 0 4.2l-8 8a3 3 0 0 1-4.2 0l-2-2a3 3 0 0 1 0-4.2z"/><path d="M11 12h.01M13 12h.01M12 11h.01M12 13h.01"/>')},

function cbFor(y){
  const cb = S.settings.cb || {};
  if(typeof cb[y]==="number") return {v:cb[y], est:false, from:y};
  const ks = Object.keys(cb).filter(k=>k<y && typeof cb[k]==="number").sort();
  if(ks.length) return {v:cb[ks[ks.length-1]], est:true, from:ks[ks.length-1]};
  return {v:506.69, est:true, from:null};
}
/* Pro Jahr (nach Behandlungsdatum): Kostendämpfungspauschale in Datumsreihenfolge vom Beihilfe-Anteil;
   Cashback-Rechnung nur mit Nicht-Vorsorge-Rechnungen. */
function computeShares(list){
  const st = S.settings, map = {}, years = {};
  const Y = y => years[y] || (years[y] = {kdpUsed:0, kvSum:0, prevSum:0, total:0, kvSub:false, n:0});
  list.slice().sort((a,b)=>a.date.localeCompare(b.date) || a.created-b.created).forEach(b=>{
    const y = yearOf(b), yr = Y(y);
    const gross = Math.round(b.amount*st.bhPct)/100;
    const ded = r2(Math.min(gross, Math.max(0, st.kdp - yr.kdpUsed)));
    yr.kdpUsed = r2(yr.kdpUsed + ded);
    const kv = r2(b.amount-gross);
    if(b.vorsorge) yr.prevSum = r2(yr.prevSum + kv);
    else { yr.kvSum = r2(yr.kvSum + kv); if(b.kvSub) yr.kvSub = true; }
    yr.total = r2(yr.total + b.amount); yr.n++;
    map[b.id] = {gross, kdp:ded, bh:r2(gross-ded), kv};
  });
  return {map, years};
}
let SH = {map:{}, years:{}};
const shares = b => SH.map[b.id] || {gross:0,kdp:0,bh:0,kv:0};
function yearInfo(y){
  const yr = SH.years[y] || {kdpUsed:0, kvSum:0, prevSum:0, total:0, kvSub:false, n:0};
  const cb = cbFor(y);
  const mode = !S.settings.cbOn ? "off" : yr.kvSub ? "lost" : (yr.kvSum > cb.v ? "worth" : "hold");
  return Object.assign({}, yr, {cb, mode});
}
/* Tatsächlich erhalten bzw. nicht erstattungsfähig */
const received = (b,k) => b[k+"Paid"] ? (typeof b[k+"Amt"]==="number" ? b[k+"Amt"] : shares(b)[k]) : 0;
const shortfall = (b,k) => (b[k+"Paid"] && typeof b[k+"Amt"]==="number") ? Math.max(0, r2(shares(b)[k]-b[k+"Amt"])) : 0;

/* Zustände: todo einreichen · wait wartet · done erstattet · own auf Pauschale angerechnet · hold für Cashback zurückhalten */
function sideState(b,k){
  const sh = shares(b), sub = b[k+"Sub"], paid = b[k+"Paid"];
  if(k==="bh"){
    if(sub && sh.bh===0 && sh.kdp>0) return "own";
    if(paid) return "done";
    return sub ? "wait" : "todo";
  }
  if(paid) return "done";
  if(sub) return "wait";
  return (!b.vorsorge && yearInfo(yearOf(b)).mode==="hold") ? "hold" : "todo";
}
function billState(b){
  const s = SIDES.map(x=>sideState(b,x.k));
  if(s.includes("todo")) return "todo";
  if(s.includes("wait")) return "wait";
  if(s.includes("hold")) return "hold";
  return "done";
}

/* Verschlüsselung (AES-GCM, Schlüssel aus Passwort via PBKDF2) */
const b64s = buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};

async function deriveKey(pw,saltB64){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64s(saltB64),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);return b64s(await crypto.subtle.exportKey("raw",k))}

async function packData(obj){const json=JSON.stringify(obj);const k=await cryptoKey();if(!k)return json;const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(json));return JSON.stringify({enc:"aes-256-gcm/pbkdf2-sha256",v:1,salt:SY.salt,iv:b64s(iv),_ts:obj._ts||0,data:b64s(ct)})}
async function unpackData(text,raw){const o=JSON.parse(text);if(!o||!o.enc)return o;const k=await cryptoKey(raw);if(!k)throw "locked";try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64s(o.iv)},k,unb64s(o.data));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw "badpw"}}

async function pushNow(){
  if(!syncOn()) return setSync("local");
  if(pushing){ pushAgain=true; return; }
  pushing = true;
  try{
    const body = {message:"Sync "+new Date().toISOString(), content:enc(await packData(S))};
    if(SY.sha) body.sha = SY.sha;
    let r = await fetch(ghUrl(),{method:"PUT",headers:ghH({"Content-Type":"application/json"}),body:JSON.stringify(body),cache:"no-store"});
    if(r.status===409||r.status===422){
      const g = await fetch(ghUrl(),{headers:ghH(),cache:"no-store"});
      if(g.ok){ SY.sha=(await g.json()).sha; body.sha=SY.sha; } else { delete body.sha; SY.sha=null; }
      r = await fetch(ghUrl(),{method:"PUT",headers:ghH({"Content-Type":"application/json"}),body:JSON.stringify(body),cache:"no-store"});
    }
    if(!r.ok) throw r.status;
    const j = await r.json(); SY.sha=j.content.sha; SY.etag=null; saveSY(); dirty=false; setSync("ok"); processPQ();
  }catch(e){
    setSync(navigator.onLine?"error":"offline", e===401?"Token ungültig oder abgelaufen":e===404?"Repository nicht gefunden oder kein Zugriff":e===403?"Kein Schreibrecht (Token-Berechtigung „Contents: Read and write“ prüfen)":(typeof e==="number"?"Fehler "+e:"GitHub ist nicht erreichbar"));

async function pullNow(force){
  if(!syncOn()||pulling||pushing||(dirty&&!force)) return;
  pulling = true;
  try{
    const r = await fetch(ghUrl(),{headers:ghH(SY.etag&&!force?{"If-None-Match":SY.etag}:{}),cache:"no-store"});
    if(r.status===304){ setSync("ok"); return; }
    if(r.status===404){ SY.sha=null; saveSY(); initialPulled=true; schedulePush(); return; }
    if(!r.ok) throw r.status;

    setSync(navigator.onLine?"error":"offline", e===401?"Token ungültig oder abgelaufen":e==="locked"?"Die Cloud-Daten sind verschlüsselt. Verbindung trennen und mit Passwort neu verbinden.":e==="badpw"?"Passwort passt nicht zu den Cloud-Daten":(typeof e==="number"?"Fehler "+e:"GitHub ist nicht erreichbar"));
  }finally{ pulling=false; if(force==="boot") finishBoot(); }
}

/* ---------- Darstellung ---------- */
const focusYear = () => ui.year==="all" ? thisYear() : ui.year;
function visibleBills(){ return ui.year==="all" ? S.bills : S.bills.filter(b=>yearOf(b)===ui.year); }
function matches(b,f){
  const s = billState(b);
  if(f==="open") return s!=="done";
  if(f==="todo") return s==="todo";
  if(f==="done") return s==="done";
  return true;
}
function matchesQuery(b){
  if(!ui.q) return true;
  const q = ui.q.toLowerCase();
  return [b.title, b.note, plainLabel(catOf(b.cat)), fmtDate(b.date), amountStr(b.amount), b.vorsorge?"vorsorge":""].some(x=>String(x).toLowerCase().includes(q));
}

function render(){
  SH = computeShares(S.bills);
  const years = [...new Set(S.bills.map(yearOf).filter(Boolean).concat([thisYear()]))].sort().reverse();
  if(ui.year!=="all" && !years.includes(ui.year)) ui.year="all";
  const chips = ['<button class="chip" data-year="all" aria-pressed="'+(ui.year==="all")+'">Alle Jahre</button>']
    .concat(years.map(y=>'<button class="chip" data-year="'+y+'" aria-pressed="'+(ui.year===y)+'">'+y+'</button>')).join("");
  $("years").innerHTML = chips; $("years2").innerHTML = chips;

  const vb = visibleBills();
  const sum = {total:0, own:0, done:0, wait:0, todo:0, hold:0, lost:0};
  const per = {bh:{open:0,todo:0,paid:0,own:0}, kv:{open:0,todo:0,paid:0,hold:0}};
  vb.forEach(b=>{
    const sh = shares(b); sum.total += b.amount; sum.own += sh.kdp; per.bh.own += sh.kdp;
    SIDES.forEach(({k})=>{
      const st = sideState(b,k), v = sh[k];
      if(st==="done"){ const got = received(b,k); sum.done+=got; per[k].paid+=got; sum.lost += shortfall(b,k); }
      else if(st==="wait"){ sum.wait+=v; per[k].open+=v; }
      else if(st==="todo"){ sum.todo+=v; per[k].open+=v; per[k].todo+=v; }
      else if(st==="hold"){ sum.hold+=v; per.kv.hold+=v; }
    });
  });

  const open = sum.wait + sum.todo;
  const pct = v => sum.total>0 ? (v/sum.total*100) : 0;
  const seg = (v,col) => v>0.004 ? '<i style="width:'+pct(v)+'%;background:'+col+'"></i>' : '';
  const leg = (v,col,l) => '<span><i style="background:'+col+'"></i>'+l+'<b class="num">'+money(v)+'</b></span>';
  $("hero").innerHTML =
    '<div class="hero-top"><div><div class="lbl">Erwartete Erstattungen offen</div><div class="big num">'+money(open)+'</div></div>'+
    '<div class="paid num">Vorgestreckt<b>'+money(sum.total)+'</b></div></div>'+
    '<div class="bar" aria-hidden="true">'+seg(sum.done,"var(--done)")+seg(sum.wait,"var(--wait)")+seg(sum.todo,"var(--todo)")+seg(sum.hold,"var(--hold)")+seg(sum.own,"var(--own)")+seg(sum.lost,"rgba(255,255,255,.45)")+'</div>'+
    '<div class="legend">'+leg(sum.done,"var(--done)","Erstattet")+leg(sum.wait,"var(--wait)","Wartet")+leg(sum.todo,"var(--todo)","Einreichen")+
      (S.settings.cbOn?leg(sum.hold,"var(--hold)","Gesammelt"):'')+(S.settings.kdp>0?leg(sum.own,"var(--own)","Pauschale"):'')+
      (sum.lost>0.004?leg(sum.lost,"rgba(255,255,255,.45)","Nicht erstattet"):'')+'</div>';

  const fy = yearInfo(focusYear());
  const kdpLeft = r2(Math.max(0, S.settings.kdp - fy.kdpUsed));
  let bhSub;
  if(per.bh.todo>0.004) bhSub = ['c-todo', money(per.bh.todo)+' noch einreichen'];
  else if(per.bh.open>0.004) bhSub = ['c-wait', 'eingereicht, wartet'];
  else if(S.settings.kdp>0 && kdpLeft>0.004 && fy.n>0) bhSub = ['c-own', 'Unter der Kosten­dämpfungs­pauschale – noch '+money(kdpLeft)];
  else if(per.bh.paid>0.004) bhSub = ['c-done', 'alles erstattet'];
  else if(per.bh.own>0.004) bhSub = ['c-own', 'auf die Pauschale angerechnet'];
  else bhSub = ['', 'keine Rechnungen'];
  let kvSub;
  if(per.kv.todo>0.004) kvSub = ['c-todo', money(per.kv.todo)+' noch einreichen'];
  else if(per.kv.open>0.004) kvSub = ['c-wait', 'eingereicht, wartet'];
  else if(per.kv.hold>0.004) kvSub = ['c-hold', money(per.kv.hold)+' für Cashback gesammelt'];
  else if(per.kv.paid>0.004) kvSub = ['c-done', 'alles erstattet'];
  else kvSub = ['', 'keine Rechnungen'];
  $("tiles").innerHTML =
    '<div class="tile"><span class="t">Beihilfe offen</span><span class="v num">'+money(per.bh.open)+'</span><span class="s num '+bhSub[0]+'">'+bhSub[1]+'</span></div>'+
    '<div class="tile"><span class="t">KV offen</span><span class="v num">'+money(per.kv.open)+'</span><span class="s num '+kvSub[0]+'">'+kvSub[1]+'</span></div>';

  renderYearCard(fy, focusYear());

  const F = [["open","Offen"],["todo","Einreichen"],["done","Erledigt"],["all","Alle"]];
  $("seg").innerHTML = F.map(([id,l])=>{
    const n = vb.filter(b=>matches(b,id)).length;
    return '<button data-filter="'+id+'" aria-pressed="'+(ui.filter===id)+'">'+l+(id!=="all"&&n?'<span class="cnt num">'+n+'</span>':'')+'</button>';
  }).join("");

  const vbSum = vb.reduce((a,b)=>a+b.amount,0);
  $("billsSub").textContent = vb.length+" Rechnung"+(vb.length===1?"":"en")+" · "+money(vbSum)+(ui.year==="all"?"":" in "+ui.year);
  const nTodo = S.bills.filter(b=>billState(b)==="todo").length;
  $("tabBadge").textContent = nTodo; $("tabBadge").hidden = !nTodo;
  const items = vb.filter(b=>matches(b,ui.filter) && matchesQuery(b)).sort((a,b)=> b.date.localeCompare(a.date) || b.created-a.created);
  if(!items.length){
    const msg = ui.q ? ["Nichts gefunden","Kein Eintrag passt zu „"+esc(ui.q)+"“."] : {
      open:["Nichts offen","Alle Rechnungen sind abgeschlossen."],
      todo:["Alles eingereicht","Gerade gibt es nichts einzureichen."],
      done:["Noch nichts abgeschlossen","Hier landen Rechnungen, bei denen nichts mehr offen ist."],
      all:["Noch keine Rechnungen","Tippe unten auf „Rechnung“, um die erste einzutragen."]
    }[ui.filter];
    $("list").innerHTML = '<div class="empty"><b>'+msg[0]+'</b>'+msg[1]+'</div>';
    $("swipeHint").hidden = true;
  } else {
    let html="", curM="";
    const monthSum = {};
    items.forEach(b=>{ const m=b.date.slice(0,7); monthSum[m]=(monthSum[m]||0)+b.amount; });
    items.forEach(b=>{
      const m = b.date.slice(0,7);
      if(m!==curM){ curM=m; html += (html?'</div>':'')+'<div class="month"><span>'+MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4)+'</span><span class="num">'+money(monthSum[m])+'</span></div><div class="list">'; }
      html += cardHTML(b);
    });
    $("list").innerHTML = html+'</div>';
    $("swipeHint").hidden = false;
  }
  renderStats(vb);
  renderAlerts();
  paintSync();
  setTimeout(checkMilestones, 60);
}

  $("stats").innerHTML = '<h2>Ausgaben nach Fachrichtung<span>'+(ui.year==="all"?"alle Jahre":ui.year)+'</span></h2>'+

function cardHTML(b){
  const c = catOf(b.cat), sh = shares(b), st = billState(b);
  const pill = {todo:'<span class="pill p-todo">einreichen</span>', wait:'<span class="pill p-wait">wartet auf Erstattung</span>', hold:'<span class="pill p-hold">für Cashback gesammelt</span>', done:'<span class="pill p-done">abgeschlossen</span>'}[st];
  const sides = SIDES.map(({k,name})=>{
    const ss = sideState(b,k), sub=b[k+"Sub"], paid=b[k+"Paid"];
    const shown = paid ? received(b,k) : sh[k];
    let hint = "";
    const sf = shortfall(b,k);
    if(sf>0.004) hint = '<small class="num neg">−'+money(sf)+' nicht erstattet</small>';
    else if(k==="bh" && sh.kdp>0) hint = '<small class="num">−'+money(sh.kdp)+' Pauschale</small>';
    else if(ss==="hold") hint = '<small>zurückhalten</small>';
    else if(k==="kv" && b.vorsorge && ss==="todo" && S.settings.cbOn) hint = '<small>Vorsorge</small>';
    let subNote = "";
    if(isISO(sub)){ const d = daysSince(sub); subNote = '<small class="num">'+fmtShort(sub)+(ss==="wait" && d>0 ? ' · '+d+' Tg.' : '')+'</small>'; }
    return '<div class="side st-'+ss+'">'+
      '<div class="side-lbl">'+name+'<b class="num">'+money(shown)+'</b>'+hint+'</div>'+
      '<button class="tick sub'+(sub?' on':'')+'" data-act="sub" data-side="'+k+'" data-id="'+esc(b.id)+'" aria-pressed="'+!!sub+'" aria-label="'+name+' eingereicht">'+
        '<span class="box">'+CHECK+'</span><span class="tx">Eingereicht'+subNote+'</span></button>'+
      '<button class="tick paid'+(paid?' on':'')+'" data-act="paid" data-side="'+k+'" data-id="'+esc(b.id)+'" aria-pressed="'+!!paid+'" aria-label="'+name+' erstattet">'+
        '<span class="box">'+CHECK+'</span><span class="tx">'+(ss==="own"&&!paid?'Bescheid':'Erstattet')+(isISO(paid)?'<small class="num">'+fmtShort(paid)+'</small>':'')+'</span></button>'+

  }).join("");
  return '<div class="row" data-row="'+esc(b.id)+'"><div class="row-act"><button data-del="'+esc(b.id)+'" aria-label="Rechnung löschen">'+IC_TRASH+'Löschen</button></div>'+
    '<article class="bill s-'+st+'">'+
    '<button class="bill-head" data-edit="'+esc(b.id)+'" aria-label="'+esc(b.title)+' bearbeiten">'+
      '<span class="cat" style="--c:'+c.c+'">'+c.svg+'</span>'+
      '<span class="bh-main"><span class="t">'+esc(b.title||plainLabel(c))+(b.photo?'<span class="clip" aria-label="Beleg hinterlegt" title="Beleg hinterlegt">'+IC_CLIP+'</span>':'')+'</span><span class="sub num">'+fmtDate(b.date)+' · '+esc(plainLabel(c))+(b.note?' · '+esc(b.note):'')+'</span><span class="pills">'+pill+(b.vorsorge?'<span class="pill p-prev">Vorsorge</span>':'')+'</span></span>'+
      '<span class="amt num">'+money(b.amount)+'</span>'+
    '</button><div class="sides">'+sides+'</div></article></div>';
}

const pendingKV = y => S.bills.filter(b=>yearOf(b)===y && !b.kvSub);
function alertHTML(kind, ic, kicker, title, text, dl, btns){

function renderAlerts(){
  const ty = thisYear(), seen = S.settings.seen || {}, out = [];
  if(S.settings.cbOn){
    [...new Set(S.bills.map(yearOf))].sort().forEach(y=>{
      const fy = yearInfo(y), pend = pendingKV(y);
      if(!pend.length) return;
      const pendSum = r2(pend.reduce((a,b)=>a+shares(b).kv,0));
      const past = y < ty, ny = +y+1;
      const left = Math.ceil((new Date(ny+"-06-30") - new Date(todayISO()))/86400000);
      const dl = past ? (left>=0 ? "Frist: 30.06."+ny+" · noch "+left+" Tage" : "Frist 30.06."+ny+" ist abgelaufen") : "";
      const n = pend.length+" Rechnung"+(pend.length===1?"":"en");
      if(fy.mode==="worth"){
        out.push(alertHTML("go", IC_SEND, y+" · Cashback-Grenze überschritten", "Jetzt bei der KV einreichen!",
          'Der KV-Anteil '+y+' liegt mit <b>'+money(fy.kvSum)+'</b> über dem Cashback von '+money(fy.cb.v)+'. Reiche die <b>'+n+' ('+money(pendSum)+')</b> ein'+(past?'.':' und ab jetzt auch jede neue aus '+y+'.'),
          dl, '<button data-goyear="'+y+'">Rechnungen zeigen</button>'));
      } else if(fy.mode==="lost"){
        out.push(alertHTML("lost", IC_SEND, y+" · Cashback entfällt", "Restliche Rechnungen einreichen",
          'Für '+y+' ist schon eine Rechnung bei der KV eingereicht, der Cashback ist damit weg. Reiche auch die übrigen <b>'+n+' ('+money(pendSum)+')</b> ein.',
          dl, '<button data-goyear="'+y+'">Rechnungen zeigen</button>'));
      } else if(fy.mode==="hold" && past && seen[y]!=="keep"){
        out.push(alertHTML("keep", IC_GIFT, y+" ist abgeschlossen", "Nicht einreichen – Cashback behalten",
          'Der KV-Anteil '+y+' liegt mit '+money(fy.kvSum)+' unter dem Cashback von <b>'+money(fy.cb.v)+'</b>'+(fy.cb.est?' (geschätzt, trag den echten Wert in den Einstellungen ein)':'')+'. Die Rechnungen nicht bei der KV einreichen, der Cashback kommt '+ny+'. Vorsorge darfst du trotzdem einreichen.',
          "", '<button data-ack="'+y+':keep">Verstanden</button>'));
      } else if(fy.mode==="hold" && y===ty && new Date().getMonth()===11 && seen[y]!=="dec"){
        out.push(alertHTML("soon", IC_CAL, "Jahresende "+y, "Stand jetzt: nicht einreichen",
          'Bis zur Cashback-Grenze fehlen noch '+money(r2(fy.cb.v-fy.kvSum))+' KV-Anteil. Im Januar steht die Entscheidung fest, einreichen kannst du dann bis 30.06.'+ny+'.',
          "", '<button data-ack="'+y+':dec">Verstanden</button>'));
      }
    });
  }
  $("alerts").innerHTML = out.join("");
}
function showPending(y){

let msBusy = false;
function checkMilestones(){
  if(msBusy || !S.settings.cbOn || $("sheet").classList.contains("open")) return;
  const seen = S.settings.seen || {};
  for(const y of [...new Set(S.bills.map(yearOf))].sort()){
    const fy = yearInfo(y);
    if(fy.mode==="worth" && !seen[y+"-worth"]){
      msBusy = true;
      S.settings.seen = Object.assign({}, seen, {[y+"-worth"]:true});
      S._ts = Date.now(); persist(); schedulePush();
      showWorthModal(y);
      msBusy = false;
      return;
    }
  }
}

const toBlobP = (cv,type,q)=>new Promise(res=>cv.toBlob(res,type,q));
async function pagesToPdf(pages){
  const te = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x=>{ const b = typeof x==="string" ? te.encode(x) : x; parts.push(b); len += b.length; };
  push("%PDF-1.4\n"); push(new Uint8Array([37,226,227,207,211,10]));
  const n = pages.length, total = 3 + 3*n;
  const obj = (id, body)=>{ offs[id] = len; push(id+" 0 obj\n"); body(); push("\nendobj\n"); };
  obj(1, ()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, ()=>push("<< /Type /Pages /Kids ["+pages.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] /Count "+n+" >>"));
  for(let i=0;i<n;i++){
    const pid = 3+3*i, cid = pid+1, iid = pid+2;
    const jpg = new Uint8Array(await (await toBlobP(pages[i],"image/jpeg",0.9)).arrayBuffer());
    const content = "q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pid, ()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>"));
    obj(cid, ()=>{ push("<< /Length "+content.length+" >>\nstream\n"); push(content); push("\nendstream"); });
    obj(iid, ()=>{ push("<< /Type /XObject /Subtype /Image /Width "+pages[i].width+" /Height "+pages[i].height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n"); push(jpg); push("\nendstream"); });
  }
  const xref = len;
  let x = "xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let id=1; id<total; id++) x += String(offs[id]).padStart(10,"0")+" 00000 n \n";
  push(x+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(parts, {type:"application/pdf"});
}
async function pagesToPng(pages){
  if(pages.length===1) return toBlobP(pages[0],"image/png");
  const c = document.createElement("canvas"); c.width = RW; c.height = RH*pages.length;
  const ctx = c.getContext("2d"); pages.forEach((p,i)=>ctx.drawImage(p,0,i*RH));
  return toBlobP(c,"image/png");
}
async function claudeUse(name){ try{ return (window.claude && window.claude.use) ? await window.claude.use(name) : null; }catch(e){ return null; } }
async function deliverFile(blob, filename){
  if(inPreview){
    const dl = await claudeUse("downloads");
    if(dl){
      try{ await dl.save({filename, data:blob}); return "ok"; }
      catch(e){ try{ await dl.save({filename, data:new Uint8Array(await blob.arrayBuffer())}); return "ok"; }catch(e2){ return "fail"; } }
    }
  }
  try{
    const file = new File([blob], filename, {type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return "ok"; }
  }catch(e){ if(e && e.name==="AbortError") return "cancel"; }
  try{
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    return "ok";
  }catch(e){ return "fail"; }
}

/* ---------- Abhaken direkt in der Karte ---------- */
function toggle(id, act, k, confirmed){
  const b = S.bills.find(x=>x.id===id); if(!b) return;
  const turningOn = !b[k+(act==="sub"?"Sub":"Paid")];
  if(k==="kv" && turningOn && !b.kvSub && !b.vorsorge && !confirmed && yearInfo(yearOf(b)).mode==="hold"){ confirmCashback(b, ()=>toggle(id, act, k, true)); return; }
  const before = Object.assign({}, b), n = Object.assign({}, b);
  const name = k==="bh" ? "Beihilfe" : "KV", amt = money(shares(b)[k]);
  let msg;
  if(act==="sub"){
    if(n[k+"Sub"]){ n[k+"Sub"]=null; n[k+"Paid"]=null; n[k+"Amt"]=null; msg=name+": nicht mehr eingereicht"; }
    else { n[k+"Sub"]=todayISO(); msg = (k==="bh" && shares(b).bh===0) ? "Beihilfe: eingereicht, wird auf die Pauschale angerechnet" : name+": eingereicht, "+amt+" offen"; }
  } else {
    if(n[k+"Paid"]){ n[k+"Paid"]=null; n[k+"Amt"]=null; msg=name+": wieder offen"; }
    else { n[k+"Paid"]=todayISO(); if(!n[k+"Sub"]) n[k+"Sub"]=todayISO(); msg = name+": "+amt+" erstattet"; }
  }
  upsertBill(n);
  showToast(msg, ()=>upsertBill(before));
}
function confirmCashback(b, go){
  const y = yearOf(b), fy = yearInfo(y);
  openSheet("Cashback "+y+" aufgeben?",
    '<div class="info">Für '+y+' liegt dein KV-Anteil (ohne Vorsorge) bei <b class="num">'+money(fy.kvSum)+'</b>. Der Cashback beträgt <b class="num">'+money(fy.cb.v)+'</b>.<br><br>'+
    'Wenn du jetzt bei der KV einreichst, entfällt der Cashback für '+y+'. Du bekämst dann voraussichtlich <b class="num">'+money(fy.cb.v-fy.kvSum)+' weniger</b>.<br><br>Ist das eine Vorsorge-Rechnung? Dann markiere sie in der Rechnung als „Vorsorge“, das gefährdet den Cashback nicht.</div>'+
    '<button class="secondary" id="cb-keep">Nicht einreichen</button>'+
    '<button class="secondary" id="cb-prev">Ist Vorsorge – markieren und einreichen</button>'+
    '<button class="danger" id="cb-go">Trotzdem bei der KV einreichen</button>', null);
  $("cb-keep").onclick = closeSheet;
  $("cb-go").onclick = ()=>{ closeSheet(); go(); };

document.addEventListener("touchstart", e=>{
  const bill = e.target.closest(".bill");

  const t = e.touches[0], dx = t.clientX-swipe.x, dy = t.clientY-swipe.y;
  if(!swipe.mode){
    if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.3) swipe.mode="h";
    else if(Math.abs(dy)>10) swipe.mode="v";
  }
  if(swipe.mode==="h"){
    e.preventDefault();
    swipe.dx = dx;
    const x = Math.min(0, Math.max(-140, swipe.base+dx));
    swipe.bill.classList.add("dragging");
    swipe.bill.style.transform = "translateX("+x+"px)";
  }
}, {passive:false});
document.addEventListener("touchend", ()=>{
  if(!swipe) return;
  const s = swipe; swipe = null;
  if(s.mode!=="h") return;
  suppressClick = true; setTimeout(()=>suppressClick=false, 350);
  s.bill.classList.remove("dragging");
  const x = s.base + s.dx;
  if(x < -200){ deleteBill(s.bill.parentElement.dataset.row); return; }
  if(x < -46){ s.bill.style.transform = "translateX(-92px)"; openRow = s.bill; }
  else { s.bill.style.transform = ""; if(openRow===s.bill) openRow=null; }
});

document.addEventListener("click", e=>{
  if(suppressClick){ e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target.closest("[data-act],[data-edit],[data-year],[data-filter],[data-del],[data-report],[data-goyear],[data-ack]");
  if(!t || t.closest("#sheet")) return;
  if(t.dataset.del){ openRow=null; deleteBill(t.dataset.del); return; }
  if(t.dataset.report){ openReport(t.dataset.report); return; }
  if(t.dataset.goyear){ showPending(t.dataset.goyear); return; }
  if(t.dataset.ack){ const [y,v]=t.dataset.ack.split(":"); S.settings.seen = Object.assign({}, S.settings.seen||{}, {[y]:v}); save(); return; }
  if(openRow){ closeOpenRow(); return; }
  if(t.dataset.act) toggle(t.dataset.id, t.dataset.act, t.dataset.side);
  else if(t.dataset.edit) openForm(t.dataset.edit);
  else if(t.dataset.year){ ui.year=t.dataset.year; render(); }
  else if(t.dataset.filter){ ui.filter=t.dataset.filter; render(); }
}, true);
$("q").addEventListener("input", e=>{ ui.q = e.target.value.trim(); render(); });
window.addEventListener("scroll", ()=>{ $("topbar").classList.toggle("scrolled", window.scrollY > 40); }, {passive:true});

/* ---------- Sheet: Bottom Sheet mit Wischen nach unten ---------- */
let sheetSave = null;
function openSheet(title, body, onSave, saveLabel, cancelLabel){
  $("sheetTitle").textContent = title;
  $("sheetBody").innerHTML = body;
  $("sheetSave").textContent = saveLabel || "Sichern";
  $("sheetSave").style.visibility = onSave ? "visible" : "hidden";
  $("sheetCancel").textContent = cancelLabel || (onSave ? "Abbrechen" : "Fertig");
  sheetSave = onSave;
  const sh = $("sheet"); sh.style.transform = "";
  $("scrim").classList.add("open");
  requestAnimationFrame(()=>sh.classList.add("open"));
  document.documentElement.style.overflow="hidden";
  $("sheetBody").scrollTop = 0;
}
function closeSheet(){
  const sh = $("sheet"); sh.classList.remove("open"); sh.style.transform = "";
  $("scrim").classList.remove("open");
  document.documentElement.style.overflow=""; sheetSave=null;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  setTimeout(checkMilestones, 450);
}
$("scrim").addEventListener("click", closeSheet);
$("sheetCancel").addEventListener("click", closeSheet);
$("sheetSave").addEventListener("click", ()=>{ if(sheetSave) sheetSave(); });
document.addEventListener("keydown", e=>{ if(e.key!=="Escape") return; if(!$("viewer").hidden){ closeViewer(); return; } if($("sheet").classList.contains("open")) closeSheet(); });
(function sheetDrag(){
  const sh = $("sheet"), body = $("sheetBody");
  let d = null;
  sh.addEventListener("touchstart", e=>{
    if(e.target.closest("input,textarea,select")) return;
    const inHead = !!e.target.closest("#sheetHead");
    if(!inHead && body.scrollTop > 0) return;
    d = {y:e.touches[0].clientY, t:Date.now(), dy:0, active:false, inHead};
  }, {passive:true});
  sh.addEventListener("touchmove", e=>{
    if(!d) return;
    const dy = e.touches[0].clientY - d.y;
    if(!d.active){
      if(dy > 8 && (d.inHead || body.scrollTop<=0)){ d.active = true; sh.classList.add("dragging"); }
      else if(dy < -8){ d = null; return; }
      else return;
    }
    e.preventDefault();
    d.dy = Math.max(0, dy);
    sh.style.transform = "translateY("+d.dy+"px)";
    $("scrim").style.opacity = String(Math.max(0, 1 - d.dy/400));
  }, {passive:false});
  sh.addEventListener("touchend", ()=>{
    if(!d) return;
    const g = d; d = null;
    sh.classList.remove("dragging"); $("scrim").style.opacity = "";
    if(!g.active) return;
    const v = g.dy / Math.max(1, Date.now()-g.t);
    if(g.dy > 120 || (g.dy > 40 && v > 0.6)) closeSheet();
    else sh.style.transform = "";
  });
})();

function openForm(id){
  const b = id ? S.bills.find(x=>x.id===id) : null;
  if(id && !b) return;
  let cat = b ? b.cat : "arzt";
  let prevTouched = !!b;
  const groups = [...new Set(CATS.map(c=>c.g))];
  const body =
    '<div class="group">'+
      '<div class="field"><label for="f-amount">Rechnungsbetrag</label><div class="money"><input id="f-amount" class="num" inputmode="decimal" autocomplete="off" placeholder="0,00" value="'+(b?amountStr(b.amount):"")+'"><span>€</span></div><div class="split num" id="f-split"></div></div>'+
      '<div class="field"><label for="f-title">Bezeichnung</label><input id="f-title" placeholder="z. B. Zahnreinigung" value="'+esc(b?b.title:"")+'" autocomplete="off" enterkeyhint="next"></div>'+
      '<div class="field"><label for="f-date">Behandlungsdatum</label><input id="f-date" type="date" value="'+(b?b.date:todayISO())+'"><small>Zählt für dieses Jahr, auch wenn die Rechnung erst später kommt.</small></div>'+
      '<div class="field"><label for="f-note">Praxis oder Notiz (optional)</label><input id="f-note" placeholder="z. B. Dr. Weber" value="'+esc(b?b.note:"")+'" autocomplete="off" enterkeyhint="done"></div>'+
    '</div>'+
    '<div class="glabel">Beleg</div><div class="group"><div class="photo-box" id="f-photo"></div></div>'+
    '<div class="group"><div class="st-row"><div class="nm">Vorsorge<small>Check-up, Früherkennung u. ä. Gefährdet den HUK-Cashback nicht und kann sofort eingereicht werden.</small></div>'+
      '<label class="sw"><input type="checkbox" id="f-prev" '+(b&&b.vorsorge?'checked':'')+' aria-label="Vorsorge"><span></span></label></div></div>'+
    '<div class="glabel">Fachrichtung</div>'+
    '<div class="group" id="f-cats">'+groups.map(g=>'<div class="cgroup">'+g+'</div><div class="cats">'+
      CATS.filter(c=>c.g===g).map(c=>'<button type="button" data-cat="'+c.id+'" style="--c:'+c.c+'" aria-pressed="'+(c.id===cat)+'"><span class="cat">'+c.svg+'</span>'+c.label+'</button>').join("")+'</div>').join("")+'</div>'+
    statusRows(b)+
    '<div class="err" id="f-err"></div>'+
    '<button class="primary" id="f-save">'+(b?"Änderungen sichern":"Rechnung hinzufügen")+'</button>'+
    (b?'<button class="danger" id="f-del">Rechnung löschen</button>':'');
  openSheet(b?"Rechnung bearbeiten":"Neue Rechnung", body, save);

  const ph = {id: b && b.photo ? b.photo.id : null, blob:null, removed:false, url:null};
  const pickBtn = (label)=>'<label class="photo-btn">'+IC_CAM+label+'<input type="file" accept="image/*" id="f-file"></label>';
  async function renderPhotoBox(){
    const box = $("f-photo"); if(!box) return;
    if(ph.url){ URL.revokeObjectURL(ph.url); ph.url=null; }
    const has = ph.blob || (ph.id && !ph.removed);
    if(!has){
      box.innerHTML = '<div class="photo-actions">'+pickBtn("Foto hinzufügen")+'</div><small class="hint" style="margin:0">Optional. Kamera, Fotos oder Dateien. Auf der Karte siehst du dann eine Büroklammer.</small>';
    } else {
      box.innerHTML = '<button type="button" class="photo-thumb" id="f-thumb">Beleg wird geladen …</button><div class="photo-actions">'+pickBtn("Ersetzen")+'<button type="button" class="photo-btn del" id="f-prm">Entfernen</button></div>';
      $("f-prm").onclick = ()=>{ ph.blob=null; ph.removed=true; renderPhotoBox(); };
      const blob = ph.blob || await getPhoto(ph.id);
      const th = $("f-thumb"); if(!th) return;
      if(blob){ ph.url = URL.createObjectURL(blob); th.innerHTML = '<img src="'+ph.url+'" alt="Beleg"><span class="zoom">Vergrößern</span>'; th.onclick = ()=>openViewer(blob); }
      else th.textContent = syncOn() ? "Beleg konnte nicht geladen werden." : "Beleg liegt auf einem anderen Gerät. Mit Cloud-Sync wird er geladen.";
    }
    const fi = $("f-file");
    if(fi) fi.onchange = async ()=>{
      const f = fi.files && fi.files[0]; if(!f) return;
      $("f-photo").insertAdjacentHTML("afterbegin",'<small class="hint" id="f-pbusy" style="margin:0">Bild wird verkleinert …</small>');
      try{ ph.blob = await compressImage(f); ph.removed = false; }
      catch(e){ $("f-err").textContent = "Das Bild konnte nicht gelesen werden. Versuche ein JPG oder ein Foto aus der Mediathek."; }
      renderPhotoBox();
    };
  }
  renderPhotoBox();

  const amountIn = $("f-amount"), titleIn = $("f-title");
  let titleTouched = !!(b && b.title);
  const previewShares = ()=>{
    const v = parseAmount(amountIn.value), d = $("f-date").value;
    if(!(v>0) || !isISO(d)) return null;
    const tmpId = b ? b.id : "__neu";
    const tmp = S.bills.filter(x=>x.id!==tmpId).concat([{id:tmpId, date:d, amount:v, vorsorge:$("f-prev").checked, created: b ? b.created : Date.now(), kvSub: b ? b.kvSub : null}]);
    const keep = SH; SH = computeShares(tmp);
    const s = SH.map[tmpId], fy = yearInfo(d.slice(0,4));
    SH = keep;
    return {s, fy};
  };
  const updSplit = ()=>{
    const p = previewShares();
    if(!p){ $("f-split").textContent = "Wird anteilig bei Beihilfe ("+S.settings.bhPct+" %) und KV ("+(100-S.settings.bhPct)+" %) eingereicht."; return; }
    let t = "Beihilfe "+money(p.s.bh)+(p.s.kdp>0?" (−"+money(p.s.kdp)+" Pauschale)":"")+" · KV "+money(p.s.kv);
    if($("f-prev").checked) t += " – Vorsorge, jederzeit bei der KV einreichen";
    else if(p.fy.mode==="hold") t += " – KV-Anteil für den Cashback zurückhalten";
    else if(p.fy.mode==="worth") t += " – Einreichen bei der KV lohnt sich";
    $("f-split").textContent = t;
    SIDES.forEach(({k})=>{ const a=$("a-"+k); if(a) a.placeholder = amountStr(p.s[k]); });
  };
  amountIn.addEventListener("input", updSplit); $("f-date").addEventListener("change", updSplit);
  $("f-prev").addEventListener("change", ()=>{ prevTouched = true; updSplit(); });
  updSplit();
  titleIn.addEventListener("input", ()=>{ titleTouched = titleIn.value.trim()!==""; });
  $("f-cats").addEventListener("click", e=>{
    const btn = e.target.closest("[data-cat]"); if(!btn) return;
    cat = btn.dataset.cat;
    $("f-cats").querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed", x===btn));
    if(!titleTouched) titleIn.placeholder = plainLabel(CAT[cat]);
    if(!prevTouched){ $("f-prev").checked = (cat==="vorsorge"); updSplit(); }
  });
  $("sheetBody").querySelectorAll('.sw input[data-k]').forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const k=cb.dataset.k, f=cb.dataset.f;
      if(f==="Sub"){ $("d-"+k+"Sub").hidden = !cb.checked; if(cb.checked && !$("d-"+k+"Sub").value) $("d-"+k+"Sub").value=todayISO(); }
      if(f==="Paid"){ $("pb-"+k).hidden = !cb.checked; if(cb.checked && !$("d-"+k+"Paid").value) $("d-"+k+"Paid").value=todayISO(); }
      if(f==="Paid" && cb.checked && !$("c-"+k+"Sub").checked){ $("c-"+k+"Sub").checked=true; $("d-"+k+"Sub").hidden=false; if(!$("d-"+k+"Sub").value) $("d-"+k+"Sub").value=todayISO(); }
      if(f==="Sub" && !cb.checked){ $("c-"+k+"Paid").checked=false; $("pb-"+k).hidden=true; }
    });
  });
  $("sheetBody").querySelectorAll("[data-zero]").forEach(btn=>btn.addEventListener("click", ()=>{ $("a-"+btn.dataset.zero).value = "0,00"; }));
  $("f-save").addEventListener("click", save);
  if(b){
    const del = $("f-del"); let armed=false;
    del.addEventListener("click", ()=>{
      if(!armed){ armed=true; del.classList.add("confirm"); del.textContent="Wirklich löschen? Nochmal tippen"; setTimeout(()=>{ if(armed){ armed=false; del.classList.remove("confirm"); del.textContent="Rechnung löschen"; } },4000); return; }
      closeSheet(); deleteBill(b.id);
    });
  }

  async function save(){
    const amount = parseAmount(amountIn.value);
    const date = $("f-date").value;
    const err = $("f-err");
    if(!(amount>0)){ err.textContent="Bitte einen Betrag eintragen, z. B. 49,05."; amountIn.focus(); return; }
    if(!isISO(date)){ err.textContent="Bitte das Behandlungsdatum wählen."; return; }
    const p = previewShares();
    const n = {
      id: b ? b.id : uid(), date, amount, cat,
      title: titleIn.value.trim() || plainLabel(CAT[cat]),
      note: $("f-note").value.trim(), vorsorge: $("f-prev").checked,
      created: b ? b.created : Date.now()
    };
    for(const {k,long} of SIDES){
      for(const f of ["Sub","Paid"]){
        const on = $("c-"+k+f).checked, d = $("d-"+k+f).value, old = b ? b[k+f] : null;
        n[k+f] = on ? (isISO(d) ? d : (old || true)) : null;
      }
      n[k+"Amt"] = null;
      if(n[k+"Paid"]){
        const raw = $("a-"+k).value.trim();
        if(raw!==""){
          const v = parseAmount(raw);
          if(!(v>=0)){ err.textContent = long+": bitte den erstatteten Betrag wie 12,50 eintragen."; return; }
          if(!p || Math.abs(v - p.s[k]) > 0.004) n[k+"Amt"] = v;
        }
      }
    }
    const oldPhoto = b && b.photo ? b.photo.id : null;
    n.photo = oldPhoto && !ph.removed ? {id:oldPhoto} : null;
    if(ph.blob){
      const pid = "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      if(!(await photoPut(pid, ph.blob))){ err.textContent = "Das Foto konnte auf diesem Gerät nicht gespeichert werden."; return; }
      n.photo = {id:pid}; queuePhoto("up", pid);
    }
    if(oldPhoto && (!n.photo || n.photo.id!==oldPhoto)) setTimeout(()=>dropPhotoIfUnused(oldPhoto), 8000);
    if(!b && n.kvSub && !n.vorsorge && p && p.fy.mode==="hold"){
      confirmCashback(n, ()=>{ upsertBill(n); showToast("Rechnung über "+money(amount)+" hinzugefügt", null); });
      return;
    }
    upsertBill(n); closeSheet();
    showToast(b ? "Gesichert" : "Rechnung über "+money(amount)+" hinzugefügt", null);
  }
}
